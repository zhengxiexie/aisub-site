<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AISub</title>
<meta name="description" content="AISub is a macOS app that turns videos into bilingual subtitles with AI.">
<meta property="og:title" content="AISub">
<meta property="og:description" content="Drop in a whole season → read the embedded subtitle track → AI translates and aligns the timing → bilingual .srt out.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://zhengxiexie.github.io/aisub-site/assets/logo.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="grid-tex" aria-hidden="true"></div>

<!-- ============================ 导航 ============================ -->
<nav class="nav">
  <div class="wrap nav-inner">
    <a class="nav-brand" href="#top">
      <img src="assets/logo.png" alt="AISub">
      <span>AISub</span>
    </a>

    <div class="nav-links" id="navLinks">
      <a href="#problem" data-i18n="nav.problem">Problem</a>
      <a href="#how"     data-i18n="nav.how">How</a>
      <a href="#features" data-i18n="nav.features">Features</a>
      <a href="#shots"   data-i18n="nav.shots">Screens</a>
      <a href="#posts-section" data-i18n="nav.posts">Changelog</a>
      <a href="#faq"     data-i18n="nav.faq">FAQ</a>
      <a class="nav-cta" href="#download" data-i18n="nav.cta">Download</a>
    </div>

    <div class="nav-tools">
      <div class="lang-switch" id="langSwitch">
        <button class="lang-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <span aria-hidden="true">🌐</span><span class="cur">English</span><span class="chev">▼</span>
        </button>
        <div class="lang-menu" role="menu">
          <a href="#" data-lang="en"       role="menuitem">English    <span class="tick"></span></a>
          <a href="#" data-lang="zh-Hans" role="menuitem">简体中文    <span class="tick"></span></a>
          <a href="#" data-lang="zh-Hant" role="menuitem">繁體中文    <span class="tick"></span></a>
          <a href="#" data-lang="ja"      role="menuitem">日本語      <span class="tick"></span></a>
          <a href="#" data-lang="ko"      role="menuitem">한국어      <span class="tick"></span></a>
          <a href="#" data-lang="fr"      role="menuitem">Français   <span class="tick"></span></a>
          <a href="#" data-lang="de"      role="menuitem">Deutsch    <span class="tick"></span></a>
          <a href="#" data-lang="es"      role="menuitem">Español     <span class="tick"></span></a>
        </div>
      </div>

      <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle theme">
        <span id="themeIco">◐</span>
      </button>

      <button class="nav-toggle" id="navToggle" type="button" aria-label="Menu">☰</button>
    </div>
  </div>
</nav>

<!-- ============================ Hero ============================ -->
<header class="hero" id="top">
  <div class="wrap">
    <div class="hero-badge" data-reveal>
      <span class="dot"></span>
      <span data-i18n="hero.badge">Native macOS</span>
    </div>

    <h1 data-i18n="hero.title" data-reveal data-reveal-delay="80"></h1>

    <p class="hero-sub" data-i18n="hero.sub" data-reveal data-reveal-delay="160"></p>

    <div class="hero-actions" data-reveal data-reveal-delay="240">
      <a class="btn btn-primary" href="#download">
        <span aria-hidden="true">↓</span><span data-i18n="hero.cta1">Download</span>
      </a>
      <a class="btn btn-ghost" href="#how">
        <span aria-hidden="true">▸</span><span data-i18n="hero.cta2">How it works</span>
      </a>
    </div>

    <p class="hero-meta" id="dlVersion" data-reveal data-reveal-delay="320"
       data-i18n="hero.version"></p>

    <div class="hero-visual" data-reveal data-reveal-delay="400">
      <img src="assets/screenshots/01-main.jpg" data-i18n-attr="alt:img.main.alt" width="2266" height="1970">
    </div>
  </div>
</header>

<!-- ============================ 痛点 ============================ -->
<section id="problem">
  <div class="wrap">
    <div class="section-head" data-reveal>
      <span class="eyebrow" data-i18n="problem.eyebrow"></span>
      <h2 data-i18n="problem.title"></h2>
      <p data-i18n="problem.sub"></p>
    </div>

    <div class="cards-2">
      <article class="card" data-reveal>
        <span class="card-num" data-i18n="problem.1.num"></span>
        <h3 data-i18n="problem.1.title"></h3>
        <p data-i18n="problem.1.body"></p>
      </article>
      <article class="card" data-reveal data-reveal-delay="120">
        <span class="card-num" data-i18n="problem.2.num"></span>
        <h3 data-i18n="problem.2.title"></h3>
        <p data-i18n="problem.2.body"></p>
      </article>
    </div>

    <p class="center dim mt-32" data-i18n="problem.outro" data-reveal></p>
  </div>
</section>

<!-- ============================ 原理 ============================ -->
<section id="how">
  <div class="wrap">
    <div class="section-head" data-reveal>
      <span class="eyebrow" data-i18n="how.eyebrow"></span>
      <h2 data-i18n="how.title"></h2>
      <p data-i18n="how.sub"></p>
    </div>

    <div class="flow" data-reveal>
      <div class="flow-step">
        <div class="flow-ico" aria-hidden="true">↓</div>
        <h4 data-i18n="how.1.title"></h4>
        <p data-i18n="how.1.body"></p>
      </div>
      <div class="flow-step">
        <div class="flow-ico" aria-hidden="true">☰</div>
        <h4 data-i18n="how.2.title"></h4>
        <p data-i18n="how.2.body"></p>
      </div>
      <div class="flow-step">
        <div class="flow-ico" aria-hidden="true">✦</div>
        <h4 data-i18n="how.3.title"></h4>
        <p data-i18n="how.3.body"></p>
      </div>
      <div class="flow-step">
        <div class="flow-ico" aria-hidden="true">✓</div>
        <h4 data-i18n="how.4.title"></h4>
        <p data-i18n="how.4.body"></p>
      </div>
    </div>

    <p class="center dim mt-32" data-i18n="how.outro" data-reveal></p>
  </div>
</section>

<!-- ============================ 亮点 ============================ -->
<section id="features">
  <div class="wrap">
    <div class="section-head" data-reveal>
      <span class="eyebrow" data-i18n="feat.eyebrow"></span>
      <h2 data-i18n="feat.title"></h2>
      <p data-i18n="feat.sub"></p>
    </div>

    <div class="features">
      <div class="feature" data-reveal>
        <div class="feature-ico" aria-hidden="true">⚡</div>
        <h4 data-i18n="feat.1.title"></h4>
        <p data-i18n="feat.1.body"></p>
        <span class="metric" data-i18n="feat.1.metric"></span>
      </div>
      <div class="feature" data-reveal data-reveal-delay="80">
        <div class="feature-ico" aria-hidden="true">◎</div>
        <h4 data-i18n="feat.2.title"></h4>
        <p data-i18n="feat.2.body"></p>
        <span class="metric" data-i18n="feat.2.metric"></span>
      </div>
      <div class="feature" data-reveal data-reveal-delay="160">
        <div class="feature-ico" aria-hidden="true">▤</div>
        <h4 data-i18n="feat.3.title"></h4>
        <p data-i18n="feat.3.body"></p>
        <span class="metric" data-i18n="feat.3.metric"></span>
      </div>
      <div class="feature" data-reveal data-reveal-delay="240">
        <div class="feature-ico" aria-hidden="true">◐</div>
        <h4 data-i18n="feat.4.title"></h4>
        <p data-i18n="feat.4.body"></p>
        <span class="metric" data-i18n="feat.4.metric"></span>
      </div>
      <div class="feature" data-reveal>
        <div class="feature-ico" aria-hidden="true">⬡</div>
        <h4 data-i18n="feat.5.title"></h4>
        <p data-i18n="feat.5.body"></p>
        <span class="metric" data-i18n="feat.5.metric"></span>
      </div>
      <div class="feature" data-reveal data-reveal-delay="80">
        <div class="feature-ico" aria-hidden="true">🌐</div>
        <h4 data-i18n="feat.6.title"></h4>
        <p data-i18n="feat.6.body"></p>
        <span class="metric" data-i18n="feat.6.metric"></span>
      </div>
    </div>
  </div>
</section>

<!-- ============================ 界面截图 ============================ -->
<section id="shots">
  <div class="wrap">
    <div class="section-head" data-reveal>
      <span class="eyebrow" data-i18n="shots.eyebrow"></span>
      <h2 data-i18n="shots.title"></h2>
      <p data-i18n="shots.sub"></p>
    </div>

    <div class="shots" data-reveal>
      <figure class="shot wide">
        <div class="shot-img">
          <img src="assets/screenshots/01-main.jpg" data-zoom loading="lazy"
               data-i18n-attr="alt:img.main.alt">
        </div>
        <figcaption class="shot-cap" data-i18n="shots.1.cap"></figcaption>
      </figure>

      <figure class="shot">
        <div class="shot-img">
          <img src="assets/screenshots/03-dropzone.jpg" data-zoom loading="lazy"
               data-i18n-attr="alt:img.drop.alt">
        </div>
        <figcaption class="shot-cap" data-i18n="shots.2.cap"></figcaption>
      </figure>

      <figure class="shot">
        <div class="shot-img">
          <img src="assets/screenshots/02-settings.jpg" data-zoom loading="lazy"
               data-i18n-attr="alt:img.settings.alt">
        </div>
        <figcaption class="shot-cap" data-i18n="shots.3.cap"></figcaption>
      </figure>
    </div>
  </div>
</section>

<!-- ============================ 下载 ============================ -->
<section id="download">
  <div class="wrap">
    <div class="download-box" data-reveal>
      <span class="eyebrow" data-i18n="dl.eyebrow"></span>
      <h2 data-i18n="dl.title"></h2>
      <p data-i18n="dl.sub"></p>

      <div class="dl-row">
        <a class="btn btn-primary" id="dlDmg" href="https://github.com/zhengxiexie/aisub/releases/latest"
           target="_blank" rel="noopener">
          <span aria-hidden="true">↓</span><span data-i18n="dl.dmg"></span>
        </a>
        <a class="btn btn-ghost" id="dlZip" href="https://github.com/zhengxiexie/aisub/releases/latest"
           target="_blank" rel="noopener">
          <span aria-hidden="true">↓</span><span data-i18n="dl.zip"></span>
        </a>
      </div>

      <p class="dl-note" id="dlNote" data-i18n="dl.note"></p>

      <table class="dl-table" id="dlAssets" hidden>
        <thead>
          <tr>
            <th data-i18n="dl.file"></th>
            <th data-i18n="dl.size"></th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <p class="dl-note mt-32" data-i18n="dl.sign"></p>
    </div>
  </div>
</section>

<!-- ============================ 日志 ============================ -->
<section id="posts-section">
  <div class="wrap">
    <div class="posts-head" data-reveal>
      <div>
        <span class="eyebrow" data-i18n="posts.eyebrow"></span>
        <h2 data-i18n="posts.title"></h2>
      </div>
      <a class="btn btn-ghost" style="padding:9px 18px;font-size:14px;"
         href="https://github.com/zhengxiexie/aisub/issues" target="_blank" rel="noopener"
         data-i18n="posts.cta"></a>
    </div>

    <div class="posts-grid" id="posts" data-reveal>
      <p class="dim" data-i18n="posts.loading"></p>
    </div>

    <p class="center dim mt-32" style="font-size:13.5px"
       data-i18n="posts.hint" data-reveal></p>
  </div>
</section>

<!-- ============================ FAQ ============================ -->
<section id="faq">
  <div class="wrap">
    <div class="section-head" data-reveal>
      <span class="eyebrow" data-i18n="faq.eyebrow"></span>
      <h2 data-i18n="faq.title"></h2>
    </div>

    <div class="faq" data-reveal>
      <details class="faq-item">
        <summary data-i18n="faq.1.q"></summary>
        <div class="faq-body">
          <p data-i18n="faq.1.a1"></p>
          <p data-i18n="faq.1.a2"></p>
        </div>
      </details>
      <details class="faq-item">
        <summary data-i18n="faq.2.q"></summary>
        <div class="faq-body">
          <p data-i18n="faq.2.a1"></p>
          <p data-i18n="faq.2.a2"></p>
        </div>
      </details>
      <details class="faq-item">
        <summary data-i18n="faq.3.q"></summary>
        <div class="faq-body">
          <p data-i18n="faq.3.a1"></p>
          <p data-i18n="faq.3.a2"></p>
        </div>
      </details>
      <details class="faq-item">
        <summary data-i18n="faq.4.q"></summary>
        <div class="faq-body">
          <p data-i18n="faq.4.a1"></p>
          <p data-i18n="faq.4.a2"></p>
        </div>
      </details>
      <details class="faq-item">
        <summary data-i18n="faq.5.q"></summary>
        <div class="faq-body">
          <p data-i18n="faq.5.a1"></p>
        </div>
      </details>
    </div>
  </div>
</section>

<!-- ============================ 页脚 ============================ -->
<footer class="footer">
  <div class="wrap">
    <div class="footer-inner">
      <div>
        <div class="footer-brand">AISub <span id="footVersion" style="font-weight:400;color:var(--text-mute)"></span></div>
        <div style="margin-top:4px" data-i18n="foot.tagline"></div>
      </div>
      <div class="footer-links">
        <a href="https://github.com/zhengxiexie/aisub" target="_blank" rel="noopener"
           data-i18n="foot.links"></a>
        <a href="https://github.com/zhengxiexie/aisub/releases/latest" target="_blank" rel="noopener"
           data-i18n="foot.releases"></a>
<a href="https://github.com/zhengxiexie/aisub/issues" target="_blank" rel="noopener"
           data-i18n="foot.feedback"></a>
        <a href="privacy.html" data-i18n="foot.privacy"></a>
        <a href="terms.html" data-i18n="foot.terms"></a>
      </div>
    </div>
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="" alt="">
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
