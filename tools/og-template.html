<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* 卡片直接复用官网设计令牌, 保证 OG 图与站点视觉一致 */
  :root {
    --bg:        #0B0C15;
    --bg-2:      #10121E;
    --surface:   rgba(255,255,255,0.035);
    --text:      #EFEFF6;
    --text-dim:  #A2A7C0;
    --text-mute: #6A6F8C;
    --brand:     #6B73F2;
    --brand-2:   #9E66F2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    position: relative;
  }
  .bg-2 { position: absolute; inset: 0; background: var(--bg-2); }

  /* aurora: 对应首页的极光背景 */
  .aurora { position: absolute; inset: 0; overflow: hidden; }
  .aurora span {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5;
  }
  .aurora span:nth-child(1) {
    width: 620px; height: 620px; top: -220px; left: -140px;
    background: radial-gradient(circle, var(--brand), transparent 70%);
  }
  .aurora span:nth-child(2) {
    width: 540px; height: 540px; top: 120px; right: -160px;
    background: radial-gradient(circle, var(--brand-2), transparent 70%);
  }
  .aurora span:nth-child(3) {
    width: 420px; height: 420px; bottom: -180px; left: 380px;
    background: radial-gradient(circle, #4C9BF0, transparent 70%); opacity: .32;
  }
  /* grid: 对应首页的网格纹理 */
  .grid {
    position: absolute; inset: 0; opacity: .5;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 78%);
            mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 78%);
  }

  .wrap { position: relative; padding: 74px 76px; height: 100%; display: flex; flex-direction: column; }

  .top { display: flex; align-items: center; gap: 16px; }
  .top img { width: 68px; height: 68px; border-radius: 17px; }
  .brand { font-size: 34px; font-weight: 700; letter-spacing: -.02em; }

  .eyebrow {
    margin-top: 46px; display: inline-block; align-self: flex-start;
    font-size: 17px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--brand-2);
    background: rgba(158,102,242,.12);
    border: 1px solid rgba(158,102,242,.28);
    padding: 8px 18px; border-radius: 999px;
  }
  h1 {
    margin-top: 24px; font-size: 74px; line-height: 1.08;
    font-weight: 700; letter-spacing: -.035em; max-width: 1010px;
  }
  h1 .accent {
    background: linear-gradient(96deg, var(--brand), var(--brand-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub {
    margin-top: 26px; font-size: 29px; line-height: 1.45; color: var(--text-dim);
    max-width: 940px;
  }

  .foot { margin-top: auto; display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
  .pill {
    font-size: 21px; color: var(--text-dim);
    background: var(--surface); border: 1px solid rgba(255,255,255,.09);
    padding: 11px 21px; border-radius: 999px;
  }
  .pill b { color: var(--text); font-weight: 600; }
  .cta {
    margin-left: auto;
    display: flex; align-items: center; gap: 12px;
    font-size: 23px; font-weight: 600; color: #fff;
    background: linear-gradient(96deg, var(--brand), var(--brand-2));
    padding: 15px 30px; border-radius: 14px;
    box-shadow: 0 12px 34px rgba(107,115,242,.32);
  }
</style>
</head>
<body>
  <div class="bg-2"></div>
  <div class="aurora"><span></span><span></span><span></span></div>
  <div class="grid"></div>

  <div class="wrap">
    <div class="top">
      <img src="__LOGO__" alt="">
      <div class="brand">AISub</div>
    </div>

    <div class="eyebrow">Native macOS</div>

    <h1>Bilingual subtitles,<br><span class="accent">translated by AI</span></h1>

    <div class="sub">Drop in a whole season. AISub reads the embedded subtitle track, translates it, and keeps the original timing.</div>

    <div class="foot">
      <div class="pill"><b>macOS 14</b> Sonoma+</div>
      <div class="pill"><b>Apple Silicon</b></div>
      <div class="pill">BYOK · <b>no subscription</b></div>
      <div class="cta">Free download ↓</div>
    </div>
  </div>
</body>
</html>
